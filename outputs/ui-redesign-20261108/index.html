<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eva · 更安静的界面</title><style>

ustify-content:center;width:40px;height:40px;border-radius:12px}.content{overflow:auto;flex:1;min-height:0;padding:12px 23px 32px;scrollbar-width:none}.content h1{font-size:29px;letter-spacing:-1px;font-weight:550;line-height:1.3;margin:4px 0 10px}.intro{color:var(--muted);font-size:12px;margin:0 0 27px;line-height:1.8}.section{font-size:11px;color:var(--muted);margin:26px 0 9px;display:flex;justify-content:space-between}.row{width:100%;min-height:62px;display:flex;align-items:center;gap:13px;text-align:left;border-bottom:1px solid var(--line);padding:12px 0}.row .copy{flex:1;min-width:0}.row b{font-weight:450;font-size:14px;display:block}.row small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.65}.row .end{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:7px}.row .end svg{width:13px;height:13px}.row>svg{width:19px;color:#686b63}.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--green);white-space:nowrap}.tag:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.primary,.secondary{min-height:45px;padding:11px 18px;border-radius:13px;font-size:13px}.primary{background:var(--accent);color:var(--bg)}.secondary{background:var(--soft)}.wide{width:100%;margin-top:19px}.hint{font-size:11px;color:var(--muted);line-height:1.9;margin:16px 0}.box{padding:17px;background:var(--soft);border-radius:16px;margin:16px 0}.box b{font-weight:500}.box p{color:var(--muted);font-size:12px;margin:6px 0 0}.search{display:flex;align-items:center;background:var(--soft);border-radius:12px;padding:9px 12px;gap:9px;margin:18px 0}.search svg{width:16px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:#969e90}.search input{padding:0;border:0;background:none;font-size:12px}label{display:block;font-size:12px;color:var(--muted);margin:20px 0 7px}textarea{resize:vertical;min-height:145px}.switch{width:36px;height:22px;background:#deded9;border-radius:20px;position:relative;flex-shrink:0}.switch:after{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:white;transition:.15s}.switch.on{background:var(--accent)}.switch.on:after{left:17px}.homebar{height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}.homebar:after{content:'';width:118px;height:4px;background:var(--ink);border-radius:10px}.notes{padding:105px 28px 25px 0}.notes h2{font-size:21px;font-weight:500;line-height:1.5}.notes p{font-size:12px;color:#898d83;line-height:2}.note-index{color:#a2a79a;font-size:11px;margin-top:28px;letter-spacing:2px}.notes hr{border:0;border-top:1px solid #dcded7;margin:25px 0}.welcome{padding-top:110px;text-align:center}.word{font-size:53px;font-weight:500;letter-spacing:-4px}.welcome h2{font-size:20px;font-weight:450;margin-top:19px}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:23px}.quick button{border:1px solid var(--line);border-radius:22px;padding:8px 12px;font-size:11px}.composer{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:15px;margin:13px 17px}.composer textarea{border:0;background:none;min-height:54px;padding:0;font-size:13px;resize:none}.composer .bar{display:flex;align-items:center;justify-content:space-between;font-size:11px}.send{background:var(--accent);color:var(--bg);border-radius:50%;width:31px;height:31px}.drawer{position:absolute;inset:0 46px 0 0;background:var(--bg);z-index:3;padding:48px 21px 25px;display:flex;flex-direction:column;box-shadow:20px 0 40px #0001}.drawer .row{min-height:47px;border:0;padding:8px 10px;border-radius:11px}.drawer .selected{background:var(--soft)}.drawer .row b{font-size:13px}.drawer-scroll{overflow:auto;flex:1}.scrim{position:absolute;inset:0;background:#0003;z-index:2}.drawer .brand{font-size:27px}.dialogwrap{position:absolute;inset:0;background:#191c2455;z-index:9;display:flex;align-items:flex-end}.sheet{background:var(--bg);border-radius:25px 25px 0 0;width:100%;max-height:88%;padding:8px 24px 30px;overflow:auto}.handle{width:33px;height:4px;background:#dddeda;border-radius:5px;margin:4px auto 17px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:19px;font-weight:550}.sheet .row{min-height:64px}.dialogwrap.center{align-items:center;justify-content:center;padding:24px}.dialogwrap.center .sheet{border-radius:22px;padding:24px}.danger{color:#b05a50}.actions{display:flex;gap:10px;margin-top:24px}.actions button{flex:1}.toast{position:absolute;z-index:20;bottom:40px;left:25px;right:25px;background:var(--accent);color:var(--bg);border-radius:12px;padding:12px;text-align:center;font-size:12px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0}.tabs button{font-size:13px;color:var(--muted);padding:9px 0}.tabs .active{color:var(--ink);border-bottom:2px solid var(--ink)}.theme-dark{--bg:#20211f;--soft:#2b2d29;--ink:#eeeee8;--muted:#96998f;--line:#353830;--accent:#e6e9df;--green:#9bad94}.bubble{background:var(--soft);padding:12px 16px;border-radius:17px;max-width:85%;margin:22px 0 25px auto;font-size:13px}.assistant{font-size:13px;line-height:2}.file{border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;gap:12px;align-items:center;margin-top:20px}.metric{font-size:32px;letter-spacing:-1px;margin:14px 0 0}.meter{height:4px;background:var(--line);border-radius:5px;margin:15px 0}.meter:after{content:'';display:block;width:29%;height:4px;background:#8b9681;border-radius:5px}.code{font:11px/1.8 monospace;background:var(--soft);padding:16px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.preview-caption{font-size:10px;color:#92968a;margin-top:20px}.empty{text-align:center;padding:45px 10px;color:var(--muted)}@media(max-width:1050px){.studio{grid-template-columns:200px 1fr}.notes{display:none}}@media(max-width:650px){.studio{display:block}.catalog{display:none}.canvas{padding:0}.canvas-top{padding:10px 18px;margin:0;background:#eeefec}.device{border:0;border-radius:0;width:100%;height:calc(100dvh - 39px);box-shadow:none}.status{display:none}.preview-caption{display:none}}
</style></head><body><div class="studio"><aside class="catalog"><div class="brand">Eva<span style="color:#919a89">.</span></div><div class="eyebrow">Android / UI Study 01</div><h2>界面目录</h2><div id="catalog"></div></aside><main class="canvas"><div class="canvas-top"><span>更安静，也更顺手。</span><div><button onclick="go('settings')">设置</button> · <button onclick="go('sidebar')">侧边栏</button> · <button onclick="dark()">明 / 暗</button></div></div><div class="device" id="device"><div class="status"><span>9:41</span><span>▮▮▮　Wi-Fi　▰</span></div><header class="top" id="top"></header><div class="content" id="content"></div><div id="dock"></div><div class="homebar"></div><div id="overlay"></div></div><div class="preview-caption">交互设计稿 · 所有数据均为示例 · 不连接真实账号与手机</div></main><aside class="notes"><div class="eyebrow">Design direction</div><h2>把对话的轻盈，<br>带到每一个页面。</h2><p>保留 Eva 主界面的留白、灰阶和圆角。设置像一份安静的目录，工具像对话中的自然延伸。</p><hr><div class="note-index" id="pageNo"></div><h2 id="noteTitle"></h2><p id="note"></p><hr><p>可点击列表进入子页；切换开关、主题和分栏；体验新增、选择和删除面板。左侧为评审目录，手机内是产品界面。</p><button class="secondary" onclick="go('dialogs')">查看弹窗规范 ↗</button></aside></div><script>
const icons={back:'m14 5-7 7 7 7',next:'m9 5 7 7-7 7',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M18 6 6 18',menu:'M4 7h16M4 12h16M4 17h10',search:'M21 21l-5-5M18 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',chat:'M5 4h14v12H9l-5 4V5',folder:'M3 6h7l2 2h9v12H3z',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',model:'m12 3 9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',phone:'M7 2h10v20H7zM10 18h4',globe:'M3 12h18M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 3c-5 6-5 12 0 18 5-6 5-12 0-18',file:'M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6',check:'m5 12 4 4L19 6',more:'M5 12h1M11 12h1M17 12h1',terminal:'m5 7 5 5-5 5M13 17h6',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z',clock:'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0zM5 11a7 7 0 0 0 14 0M12 18v4',moon:'M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12',send:'M12 19V5m-6 6 6-6 6 6'};
const I=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]||icons.grid}"/></svg>`;
const B=(n,fn,label)=>`<button class="icon" onclick="${fn}" aria-label="${label||n}">${I(n)}</button>`;
const R=(title,sub='',dest='',ico='',end='')=>`<button class="row" ${dest?`onclick="go('${dest}')"`:''}>${ico?I(ico):''}<span class="copy"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span><span class="end">${end}${dest?I('next'):''}</span></button>`;
const G=(name,body)=>`<div class="section">${name}</div>${body}`;
const T=(title,sub='',on=false)=>`<button class="row" onclick="this.querySelector('.switch').classList.toggle('on');this.setAttribute('aria-checked',this.querySelector('.switch').classList.contains('on'))" role="switch" aria-checked="${on}"><span class="copy"><b>${title}</b><small>${sub}</small></span><span class="switch ${on?'on':''}"></span></button>`;
const A=(text,fn,cls='primary')=>`<button class="${cls} wide" onclick="${fn}">${text}</button>`;
const F=(name,value='',type='text')=>`<label>${name}</label><input type="${type}" value="${value}" aria-label="${name}">`;
const search=placeholder=>`<div class="search">${I('search')}<input placeholder="${placeholder}" aria-label="${placeholder}" oninput="filter(this.value)"></div>`;
const tag=t=>`<span class="tag">${t}</span>`;
const pages={};function P(id,title,desc,body,parent='settings'){pages[id]={title,desc,body,parent};}
P('home','主界面','保留已有主界面的留白与输入框比例，让设置延续相同的视觉语法。',()=>`<div class="welcome"><div class="word">Eva</div><h2>今天想完成什么？</h2><p class="intro">从一个想法，到一件完成的事。</p><div class="quick"><button onclick="go('phone')">手机控制</button><button onclick="go('web')">浏览网页</button><button onclick="go('files')">处理文件</button></div></div>`,'home');
P('chat','对话','对话作为视觉锚点。低对比用户气泡，工具结果和交付文件保持轻量。',()=>`<div class="bubble">帮我整理今天的项目进展，做成一份报告。</div><div class="assistant"><span class="tag">已完成 · 3 个步骤</span><p>今天的进展已经整理好了，包含完成事项、待办和下一步安排。</p><div class="file">${I('file')}<div>项目进展报告.docx<br><small style="color:var(--muted)">Word 文档 · 24 KB</small></div>${B('next',"go('reader')",'预览文档')}</div><p>你可以先看看，需要调整的地方随时告诉我。</p></div>`,'home');
P('sidebar','侧边栏','聚焦新建、项目和最近对话；工具入口收拢到底部，删除与整理进入会话菜单。',()=>'', 'home');
P('settings','设置','用清晰的三段目录取代密集功能堆叠。少量图标只出现在一级入口。',()=>search('搜索设置')+G('连接与能力',R('账号与模型','','models','model')+R('能力与组件','','components','grid')+R('技能与插件','','extensions','grid')+R('记忆','','memories','file'))+G('偏好',R('手机控制与权限','','permissions','shield')+R('任务与后台','','execution','clock')+R('语音与唤醒','','voice','mic')+R('浏览器','','browser','globe')+R('工作区与存储','','storage','folder')+R('外观','','appearance','moon'))+G('更多',R('自动化钩子','','hooks','terminal')+R('数据与隐私','','privacy','shield')+R('关于 Eva','','about','chat')),'home');
P('models','账号与模型','账号、提供商和新会话默认分开呈现。连接状态与验证结果不混用。',()=>G('账号',R('OpenAI / ChatGPT','登录后管理账号与可用模型','account','model'))+G('新会话默认',`<label style="display:flex;align-items:center;gap:12px;color:var(--ink)">设置默认模型<select style="flex:1;min-width:0;font-size:12px" aria-label="设置默认模型" onchange="toast('演示：已保存为新会话默认模型')"><optgroup label="DeepSeek"><option>DeepSeek Chat</option><option>DeepSeek Reasoner</option></optgroup><optgroup label="自定义提供商"><option>已加入的模型 A</option></optgroup></select></label>`)+G('API 提供商',R('DeepSeek','2 个模型 · Chat Completions','provider','model',tag('已配置'))+R('自定义提供商','3 个模型 · Responses','provider','model'))+A('添加提供商',"go('provider-new')",'secondary')+'<p class="hint">这里的默认值用于新对话。当前对话可在输入框中单独切换模型。</p>');
P('account','OpenAI / ChatGPT','把登录作为明确的单一步骤，更多细节留在成功后的账号页。',()=>'<div class="box"><b>连接你的账号</b><p>使用浏览器完成授权后，返回 Eva 继续。</p></div>'+A('前往登录',"sheet('login')")+G('账号使用',R('可用模型','','catalog')+R('使用额度','登录后查看')),'models');
P('provider','DeepSeek','常用操作可见，配置与诊断分层。删除放入更多菜单，避免误触。',()=>'<div class="box"><span class="tag">已配置</span><p>api.deepseek.com · Chat Completions</p></div>'+R('模型目录','管理模型显示、默认值与推理档位','catalog')+R('连接配置','地址、协议与密钥','provider-new')+G('连接检查',R('获取模型目录','检查目录接口', 'test')+R('测试文本调用','可能产生费用','test')+R('测试连续工具调用','可能产生费用','test'))+A('更多操作',"sheet('provider-more')",'secondary'),'models');
P('provider-new','连接配置','表单使用统一的字段间距。密钥隐藏，测试可能计费时在操作前明确说明。',()=>F('名称','DeepSeek')+F('API 地址','https://api.deepseek.com')+'<label>接口协议</label><select><option>Chat Completions</option><option>Responses</option></select>'+F('API 密钥','','password')+'<p class="hint">正式实现中由 Android 安全凭据服务保存密钥。</p>'+A('保存配置',"toast('演示：配置已保存');go('provider')"),'models');
P('catalog','模型目录','按提供商分组，单行只保留名称和状态；详细设置进入模型详情。',()=>search('搜索模型')+G('DeepSeek',R('DeepSeek Chat','deepseek-chat','model-detail','model','默认')+R('DeepSeek Reasoner','deepseek-reasoner','model-detail','model'))+G('OpenAI / ChatGPT',R('登录后查看账号模型','','account','model'))+A('手动添加模型',"sheet('add-model')",'secondary'),'models');
P('model-detail','模型详情','默认值、显示偏好、推理档位在同一处管理。',()=>'<h1>DeepSeek Chat</h1><p class="intro">deepseek-chat · DeepSeek</p>'+T('在选择器中显示','隐藏后仍保留模型配置',true)+R('显示名称','DeepSeek Chat','rename')+R('推理档位','使用服务商支持的档位','effort')+A('设为新会话默认',"toast('演示：已设为默认模型')"),'catalog');
P('components','能力与组件','保留完整代理的能力范围，以使用目的分组；专业工具单列，安装动作进入详情。',()=>'<div class="box"><span class="tag">基础环境已就绪</span><p>选装能力，也可以在任务需要时再安装。</p></div>'+G('按需安装',R('办公文档','Word、Excel、PowerPoint、PDF','component','file', '已安装')+R('开发工具','Python、Node.js、Git、APK 构建','component','terminal','部分安装')+R('媒体处理','音视频转码与处理','component','grid','未安装'))+G('专业工具',R('REA','程序分析与逆向工具','component','terminal')+R('Ghidra','原生程序反编译','component','terminal')));
P('component','组件详情','安装、修复、进度和诊断沿用同一个页面结构。',()=>'<h1>办公文档</h1><p class="intro">在手机上制作、读取与预览常用文档。</p>'+R('文档生成','Word · Excel · PowerPoint','', '',tag('已安装'))+R('渲染引擎','用于文档预览','','',tag('已安装'))+A('检查组件',"toast('演示：组件状态正常')")+A('修复或补齐',"sheet('install')",'secondary')+G('高级',R('安装记录','','diagnostics')),'components');
P('extensions','技能与插件','插件、技能与 MCP 沿用同一列表骨架，不让导入表单长期占据页面。',()=>'<div class="tabs">'+['插件','技能','MCP'].map((s,i)=>`<button class="${!i?'active':''}" onclick="go('${['extensions','skills','mcp'][i]}')">${s}</button>`).join('')+'</div>'+search('搜索插件')+R('文档工具','制作与处理办公文件','extension-detail','file',tag('启用'))+R('开发工具','编写与构建项目','extension-detail','terminal',tag('启用'))+A('添加插件',"sheet('extension-add')",'secondary'));

function go(id){if(!pages[id]){return action(id)}current=id;location.hash=id;document.getElementById('overlay').innerHTML='';const p=pages[id];document.getElementById('top').innerHTML=B(['home','chat'].includes(id)?'menu':'back',['home','chat'].includes(id)?"go('sidebar')":`go('${p.parent}')`,'返回')+`<strong>${['settings','home','sidebar'].includes(id)?'Eva':p.title}</strong>`+(['chat','reader'].includes(id)?B('more',id==='chat'?"sheet('chat-menu')":"toast('演示：分享、编辑与文件信息')",'更多'):id==='settings'?B('grid',"go('tools')",'工具'):'<span style="width:40px"></span>');document.getElementById('content').innerHTML=(['home','chat','sidebar'].includes(id)?'':`<h1>${p.title}</h1>`)+p.body();document.getElementById('content').scrollTop=0;document.getElementById('dock').innerHTML=['home','chat'].includes(id)?`<div class="composer"><textarea aria-label="消息" placeholder="和 Eva 一起工作"></textarea><div class="bar">${B('plus',"sheet('attach')",'附件')}<button onclick="sheet('model')">DeepSeek Chat ⌄</button><button class="send" onclick="toast('这是交互设计稿，消息不会发送')" aria-label="发送">${I('send')}</button></div></div>`:'';document.querySelectorAll('.catalog button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById('pageNo').textContent='SCREEN '+String(Object.keys(pages).indexOf(id)+1).padStart(2,'0');document.getElementById('noteTitle').textContent=p.title;document.getElementById('note').textContent=p.desc;if(id==='sidebar')drawer();}
function drawer(){document.getElementById('content').innerHTML='<div class="welcome"><div class="word">Eva</div></div>';document.getElementById('overlay').innerHTML=`<div class="scrim" onclick="go('home')"></div><aside class="drawer"><div style="display:flex;align-items:center;justify-content:space-between"><span class="brand">Eva</span>${B('close',"go('home')",'关闭侧栏')}</div>${A('＋ 新对话',"go('home')",'secondary')}<div class="drawer-scroll">${G('项目',R('Eva Android','','project','folder')+R('创建项目','','new-project','plus'))}${G('今天',R('整理今天的项目进展','','chat','chat')+R('帮我生成一份报告','','chat','chat'))}${G('昨天',R('浏览网页并整理资料','','chat','chat')+R('检查构建问题','','chat','chat'))}</div><div style="border-top:1px solid var(--line);padding-top:10px">${R('工具','','tools','grid')+R('设置','','settings','settings')}<small style="display:block;padding:12px 10px;color:var(--muted);font-size:10px">${tag('在此手机上执行')}</small></div></aside>`;}
function closeSheet(){document.getElementById('overlay').innerHTML=''}
function showSheet(title,body,center=false){document.getElementById('overlay').innerHTML=`<div class="dialogwrap ${center?'center':''}" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}">${center?'':'<div class="handle"></div>'}<div class="sheet-head"><h2>${title}</h2>${B('close','closeSheet()','关闭')}</div>${body}</section></div>`;document.querySelector('.sheet button')?.focus();}
function option(t,s,fn){return `<button class="row" onclick="${fn}"><span class="copy"><b>${t}</b>${s?`<small>${s}</small>`:''}</span>${I('next')}</button>`}
function sheet(kind){let title='',body='';if(kind==='model'){title='选择模型';body=search('搜索模型')+G('DeepSeek',option('DeepSeek Chat','当前使用',"closeSheet();toast('演示：已选择 DeepSeek Chat')")+option('DeepSeek Reasoner','适合复杂推理',"closeSheet();toast('演示：已选择 DeepSeek Reasoner')"))+option('管理模型','','go(\'models\')');}else if(kind==='attach'){title='添加到对话';body=option('拍照','使用相机',"toast('演示：正式版将打开相机')")+option('照片与视频','从相册中选择',"toast('演示：正式版将打开系统照片选择器')")+option('文件或文件夹','从手机导入',"toast('演示：正式版将打开系统文件选择器')")+option('技能与插件','为对话添加能力',"go('extensions')");}else if(kind==='chat-menu'){title='会话操作';body=option('重命名','','action(\'rename\')')+option('归档会话','保留消息与文件',"closeSheet();toast('演示：已归档会话')")+option('删除会话','保留工作区文件',"confirmDelete('当前会话')");}else if(kind==='restore'){title='恢复备份预览';body='<div class="box"><b>12 个对话 · 2 个项目 · 1 个草稿</b><p>示例备份，尚未修改当前数据。</p></div><p class="hint">合并为新的只读历史，保留现有对话，不重新执行任务。正式执行前会保存当前会话快照。</p>'+A('合并为只读历史',"closeSheet();toast('设计预览：没有导入或修改真实数据')");}else if(kind==='install'){title='安装办公组件？';body='<p class="hint">补齐文档生成与预览所需组件。需要联网；安装过程中可以查看进度与错误。</p>'+A('确认安装',"closeSheet();toast('设计预览：没有下载或安装组件')");}else if(kind==='provider-more'){title='提供商操作';body=option('编辑配置','','go(\'provider-new\')')+option('删除提供商','删除后新任务无法使用此连接',"confirmDelete('DeepSeek 提供商')");}else if(kind==='web-menu'){title='浏览器';body=['标签页','书签','历史记录','下载','网站权限'].map(s=>option(s,'',`toast('设计预览：${s}列表')`)).join('');}else if(kind==='capture'){title='准备采集';body='<p class="hint">Eva 会按本次目标准备采集环境。Android 要求授权时，请在系统页面核对并确认。</p>'+A('继续',"closeSheet();toast('设计预览：没有启动网络采集')");}else if(kind==='mcp-add'||kind==='extension-add'||kind==='skill-add'||kind==='file-add'){title=kind==='mcp-add'?'添加 MCP 连接':kind==='skill-add'?'添加技能':kind==='file-add'?'新建或导入':'添加插件';body=kind==='mcp-add'?F('名称','')+'<label>连接方式</label><select><option>远程 HTTPS</option><option>本地命令</option></select>'+F('地址或命令','')+A('保存连接',"closeSheet();toast('演示：已保存连接')"):option('新建','','go(\'skill-edit\')')+option('从文件导入','打开系统文件选择器',"toast('演示：没有导入真实文件')");}else if(kind==='add-model'){title='添加模型';body=F('模型 ID','')+F('显示名称','')+A('添加',"closeSheet();toast('演示：已添加模型')");}else if(kind==='login'){title='账号授权';body='<p class="hint">正式版在浏览器中完成授权后返回 Eva。</p>'+A('知道了','closeSheet()');}showSheet(title,body);}
function confirmDelete(name){showSheet('删除'+name+'？','<p class="hint">请确认要删除的对象。此处为设计预览，不会影响真实数据。</p><div class="actions"><button class="secondary" onclick="closeSheet()">取消</button><button class="primary" onclick="closeSheet();toast(\'演示：已删除\')">确认删除</button></div>',true);}
function action(id){const map={timeout:['命令超时',['30 秒','60 秒','120 秒','300 秒']],effort:['推理档位',['跟随模型默认','低','中','高']],scope:['作用范围',['个人技能','当前项目']],frequency:['运行频率',['每天','每周','每隔若干小时','高级时间规则']],event:['触发事件',['任务开始','任务完成','任务失败']],pause:['停顿时间',['2 秒','3 秒','5 秒']], 'browser-mode':['默认浏览模式',['桌面版','手机版']],'phone-mode':['执行模式',['前台手机','后台虚拟屏（需要系统支持）']]};if(map[id]){const [t,list]=map[id];showSheet(t,list.map(s=>option(s,'',`closeSheet();toast('演示：已选择 ${s}')`)).join(''));return}if(id==='dark'||id==='light'){document.getElementById('device').classList.toggle('theme-dark',id==='dark');return}if(id==='rename'||id==='new-project'){showSheet(id==='rename'?'修改名称':'创建项目',F('名称','')+A('保存',"closeSheet();toast('演示：名称已保存')"));return}const m={'choose-model':'model',attach:'attach','new-connection':'mcp-add','delete-demo':'delete','install-demo':'install','restore-demo':'restore','chat-menu':'chat-menu'};if(m[id]){if(m[id]==='delete')confirmDelete('当前会话');else sheet(m[id]);return}showSheet(id==='test'?'连接检查':id==='system-permission'?'系统授权':'导入文件',`<p class="hint">${id==='test'?'真实连接测试可能产生费用。此设计稿不会发送请求。':id==='system-permission'?'正式版将前往 Android 系统设置完成授权。此设计稿不改变设备权限。':'正式版通过系统文件选择器导入。'}</p>`+A('知道了','closeSheet()'));}
function filter(value){const root=document.querySelector('.sheet')||document.querySelector('.drawer')||document.getElementById('content');root.querySelectorAll('.row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(value.toLowerCase()));root.querySelectorAll('.row').forEach(r=>r.style.display=r.hidden?'none':'flex');}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.getElementById('device').append(e);setTimeout(()=>e.remove(),2300)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&document.querySelector('.sheet')){const a=[...document.querySelectorAll('.sheet button,.sheet input,.sheet select,.sheet textarea')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
const nav=['home','chat','sidebar','settings','models','components','extensions','memories','permissions','execution','voice','browser','storage','appearance','hooks','privacy','about','tools','dialogs'];document.getElementById('catalog').innerHTML=nav.map(id=>`<button data-page="${id}" onclick="go('${id}')">${pages[id].title}</button>`).join('');go(pages[location.hash.slice(1)]?location.hash.slice(1):'settings');window.addEventListener('hashchange',()=>{let k=location.hash.slice(1);if(pages[k]&&k!==current)go(k)});
</script></body></html>
