<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eva · UI 设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeefed;color:#252622;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;--bg:#fff;--muted:#85867e;--line:#ecece7;--soft:#f5f5f1;--ink:#252622}button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #6b826a;outline-offset:2px}button:hover{background:var(--soft)}.studio{max-width:1180px;margin:36px auto;display:grid;grid-template-columns:230px 430px 1fr;gap:30px;align-items:start;padding:0 20px}.brand{font-size:25px;font-weight:650;letter-spacing:-1px}.eyebrow{color:#888b81;font-size:11px;letter-spacing:2px;margin:8px 0 28px}.nav button{display:block;text-align:left;width:100%;padding:9px 12px;border-radius:8px;margin:3px 0;color:#6b6e64}.nav button.active{background:#e0e4dc;color:#354435;font-weight:600}.nav small{display:block;font-size:11px;margin:22px 12px 8px;color:#85877f}.device{height:858px;border:1px solid #d8dad3;border-radius:32px;background:var(--bg);box-shadow:0 14px 50px #1b241b0c;overflow:hidden;display:flex;flex-direction:column;position:relative}.status{height:35px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 24px 0;font-size:12px;font-weight:600}.header{height:58px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}.header strong{font-size:17px;font-weight:600;flex:1}.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.content{flex:1;overflow:auto;padding:16px 20px 30px;scrollbar-width:thin}.section{margin-bottom:22px}.section h2{font-size:11px;font-weight:550;color:var(--muted);margin:0 0 5px;letter-spacing:.7px}.row{display:flex;width:100%;align-items:center;gap:12px;padding:11px 0;text-align:left;min-height:52px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row>.icon{color:#74786d;flex-shrink:0}.copy{flex:1;min-width:0}.copy b{font-size:14px;font-weight:500;display:block}.copy small{color:var(--muted);font-size:11px;display:block;margin-top:3px}.value{font-size:12px;color:var(--muted);max-width:120px;text-align:right}.row .arrow{width:14px;color:#a7aaa0}.note{font-size:12px;color:var(--muted);line-height:1.8;margin:10px 0 20px}.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:9px 12px;margin-bottom:16px;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:none;font-size:13px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 15px}.tabs button{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent}.tabs .selected{color:var(--ink);border-bottom-color:var(--ink)}.pill{font-size:10px;background:var(--soft);color:#6e7767;padding:3px 7px;border-radius:5px}.switch{width:34px;height:20px;border-radius:15px;background:#d6d9d1;padding:2px;display:inline-flex;align-items:center}.switch:before{content:'';width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002}.switch[aria-checked=true]{background:#657a60;justify-content:flex-end}.primary{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:12px}.primary:hover{opacity:.8;background:var(--ink)}.outline{padding:8px 13px;border:1px solid var(--line);border-radius:8px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.toolbar b{font-size:12px;font-weight:500}.tile{width:35px;height:35px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:var(--soft);flex-shrink:0}.field{display:block;margin:14px 0;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.aside{padding-top:25px}.aside h1{font-size:23px;line-height:1.5;font-weight:550;margin:0 0 16px}.aside p{font-size:13px;color:#74796d;line-height:1.9}.aside .number{font-size:11px;letter-spacing:2px;color:#858b7d;margin-bottom:12px}.aside hr{border:0;border-top:1px solid #d9ddd3;margin:24px 0}.legend{font-size:11px;color:#8b9084}.homebar{height:5px;width:110px;margin:8px auto;background:var(--ink);border-radius:9px;flex-shrink:0}.chat p{font-size:14px;line-height:1.95}.bubble{background:var(--soft);padding:12px 16px;border-radius:16px;margin:12px 0 30px 44px;font-size:13px}.completed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin:20px 0 12px}.change{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;text-align:left;margin:20px 0 8px;font-size:12px}.change span:nth-child(2){flex:1}.green{color:#547a49}.actions{display:flex;gap:3px;color:var(--muted)}.composer{border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 16px;color:var(--muted);font-size:13px}.composer footer{display:flex;justify-content:space-between;margin-top:15px;font-size:11px}.diff{font:11px/1.9 ui-monospace,monospace;padding:12px;background:var(--soft);border-radius:9px;overflow:auto;white-space:pre}.file{margin:14px 0}.toast{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;font-size:12px;z-index:5;white-space:nowrap}.empty{text-align:center;padding:55px 16px}.empty .icon{width:28px;height:28px;color:var(--muted)}.empty h3{font-size:15px;font-weight:500}.dark{--bg:#20211f;--ink:#ededE7;--line:#353630;--muted:#999d91;--soft:#2a2c27;color:var(--ink)}@media(max-width:1000px){.studio{grid-template-columns:180px 430px;justify-content:center}.aside{grid-column:1/-1;padding:0}}@media(max-width:670px){.studio{display:block;margin:0;padding:0}.brand,.eyebrow,.aside,.studio>aside:first-child>.legend{display:none}.nav{display:flex;overflow:auto;background:#eeefed;padding:6px;gap:4px}.nav small{display:none}.nav button{width:auto;white-space:nowrap;font-size:12px;padding:7px 10px}.device{width:100%;height:calc(100dvh - 52px);border:0;border-radius:0;box-shadow:none}.status,.homebar{display:none}}
</style><body><div class="studio"><aside><div class="brand">eva<span style="color:#7f8b74">.</span></div><div class="eyebrow">界面设计提案 · 01</div><nav class="nav" id="nav"></nav><p class="legend">离线交互预览 · 全部数据为示例<br>2026.11.06</p></aside><main class="device" id="device"><div class="status"><span>9:41</span><span>▰ ▰ 100%</span></div><header class="header" id="header"></header><div class="content" id="content"></div><div id="dock"></div><div class="homebar"></div></main><aside class="aside" id="aside"></aside></div>
<script>
const paths={back:'m14 6-6 6 6 6',arrow:'m9 6 6 6-6 6',search:'m21 21-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',grid:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z',globe:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c-5 5-5 13 0 18 5-5 5-13 0-18',folder:'M3 6h7l2 3h9v12H3z',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 7v5l3 2',code:'m8 7-5 5 5 5 m8-10 5 5-5 5 M14 4l-4 16',file:'M5 3h9l5 5v13H5z M14 3v6h5 M9 13h6 M9 17h6',copy:'M8 8h12v13H8z M16 8V3H3v13h5',check:'m5 12 4 4L19 6',plus:'M12 5v14 M5 12h14',info:'M12 11v6 M12 7h.01 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',phone:'M7 2h10v20H7z M11 18h2',bell:'M5 17h14l-2-4V8a5 5 0 0 0-10 0v5z M10 21h4'};
function ic(n,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.grid}"/></svg>`}
const titles={settings:'设置',chat:'回答与文件变更',extensions:'技能与插件',models:'账号与模型',permissions:'工具与权限',execution:'任务与后台',browser:'浏览器',storage:'工作区与存储',appearance:'外观',data:'数据与隐私',about:'关于与诊断',tools:'工具',memory:'记忆',hooks:'自动化钩子'};
const notes={settings:['清晰的设置层级','账号、扩展、偏好、应用信息，按使用目的分组。工具移到统一工具入口，设置首页仅保留配置项。','去掉层层套卡片与重复副标题。行高约 52px，标题只出现一次，当前值靠右显示。'],chat:['操作回到内容旁边','复制保留一个图标入口。当前更多菜单只有重复复制和文件变更，因此移除这颗省略号。','有变更时展示文件摘要，点击进入本轮变更详情。没有变更时不显示入口。'],extensions:['保留桌面的简洁感','用单一标题和插件、技能、MCP 三个标签替代重复的“自定义”标题及手机上的侧栏。','搜索、添加、筛选放到同一区域。介绍进入详情，卡片只展示识别和状态所需的信息。']};
let page='settings',tab='插件',filter='已安装',history=[],query='',dark=false;const content=document.querySelector('#content');
function btn(icon,label,action){return `<button class="iconbtn" aria-label="${label}" onclick="${action}">${ic(icon)}</button>`}
function row(icon,label,value='',target='',sub=''){return `<button class="row" ${target?`onclick="go('${target}')"`:`onclick="detail('${label}')"`}>${ic(icon)}<span class="copy"><b>${label}</b>${sub?`<small>${sub}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}${ic('arrow','arrow')}</button>`}
function section(name,body){return `<section class="section"><h2>${name}</h2>${body}</section>`}
function switchRow(label,on=true){return `<div class="row"><span class="copy"><b>${label}</b></span><button class="switch" role="switch" aria-label="${label}" aria-checked="${on}" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true');toast('预览状态已更新')"></button></div>`}
function selectRow(label,values){return `<label class="row"><span class="copy"><b>${label}</b></span><select aria-label="${label}" onchange="toast('预览选择已更新')" style="border:0;background:var(--bg);max-width:170px">${values.map(x=>`<option>${x}</option>`).join('')}</select></label>`}
function field(name,value,type='text'){return `<label class="field">${name}<input type="${type}" value="${value}"></label>`}
function save(){toast('仅更新本页预览')}
function toast(s){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=s;document.querySelector('#device').append(el);setTimeout(()=>el.remove(),2200)}
function go(p){history.push(page);page=p;query='';render()}
function back(){page=history.pop()||'settings';render()}
function render(){document.querySelector('#nav').innerHTML=Object.entries(titles).map(([key,name])=>`<button class="${page===key?'active':''}" onclick="go('${key}')">${name}</button>`).join('');document.querySelector('#header').innerHTML=btn('back','返回','back()')+`<strong>${page==='chat'?'优化 Eva 界面':titles[page]||page}</strong>`+(page==='settings'?btn('grid','打开工具',"go('tools')"):'');document.querySelector('#dock').innerHTML='';content.className='content';const note=notes[page]||['统一的页面语言','标题、表单、列表和状态遵循同一套间距与字重。常用设置就近调整，低频说明按需展开。','此页展示配置结构与交互方式，所有账号、权限、连接及用量均为示例。'];document.querySelector('#aside').innerHTML=`<div class="number">EVA ANDROID / UI REVIEW</div><h1>${note[0]}</h1><p>${note[1]}</p><hr><p>${note[2]}</p><p class="legend">点击左侧切换页面，手机框内可继续进入详情。<br>表单与开关仅用于设计评审。</p>`;
let html='';
if(page==='settings')html=section('账号',row('user','账号与模型','示例账号','models'))+section('能力与个性化',row('grid','技能与插件','','extensions')+row('file','记忆','','memory')+row('code','自动化钩子','','hooks'))+section('偏好设置',row('shield','工具与权限','','permissions')+row('clock','任务与后台','','execution')+row('globe','浏览器','','browser')+row('folder','工作区与存储','','storage')+row('moon','外观',dark?'深色':'浅色','appearance'))+section('应用',row('shield','数据与隐私','','data')+row('info','关于与诊断','0.0.57','about'));
if(page==='models')html=section('账号',row('user','OpenAI / ChatGPT','示例 · 已连接','账号详情','管理登录和用量'))+section('API 提供商',row('code','DeepSeek','默认','提供商详情','示例 · deepseek-chat')+row('plus','添加提供商','','添加提供商'))+section('默认模型',selectRow('模型',['DeepSeek · deepseek-chat','GPT · 示例模型']))+'<p class="note">模型选择于下一次发送时生效。</p>';
if(page==='permissions')html=section('手机执行',row('phone','手机控制','示例 · 待授权','手机控制授权')+row('phone','截图与录屏','按需授权','截图授权')+row('bell','通知与后台','示例 · 已允许','通知权限'))+section('文件访问',row('folder','照片与文件','系统选择器','文件权限说明'))+'<p class="note">实际授权状态应在从系统设置返回后自动刷新。</p>';
if(page==='execution')html=section('任务执行',selectRow('命令超时',['120 秒','30 秒','60 秒','300 秒']))+section('后台运行',row('bell','系统后台权限','查看','后台权限')+row('clock','定时任务','','定时任务')+row('file','执行记录','','执行记录'))+'<details class="note"><summary>后台运行说明</summary>手机控制任务使用前台服务。长期后台与进程回收后的恢复仍待验收，当前状态应由真实服务提供。</details>';
if(page==='browser')html=section('浏览偏好',selectRow('默认浏览模式',['桌面版','手机版']))+section('启动页',field('HTTPS 地址','https://example.com','url')+'<button class="primary" onclick="save()">保存</button>')+section('网站与文件',row('shield','网站权限','','网站权限')+row('folder','下载记录','','下载记录'))+'<p class="note">网站权限与下载管理在实施时复用 Eva 浏览器的现有入口。</p>';
if(page==='storage')html=section('当前工作区',row('folder','Eva-Android','示例项目','工作区文件')+row('folder','导入与导出','','文件导入与导出'))+section('设备存储',row('grid','运行环境','查看','运行环境')+'<p class="note">示例数据 · 可用 24.6 GB<br>空间统计与组件状态在正式版本中读取设备。</p>');
if(page==='appearance')html=section('颜色主题',['浅色','深色'].map((x,i)=>`<button class="row" onclick="dark=${!!i};document.querySelector('#device').classList.toggle('dark',dark);render()"><span class="copy"><b>${x}</b></span>${dark===!!i?ic('check'):''}</button>`).join(''))+'<p class="note">在本预览中可直接切换并查看所有页面。</p>';
if(page==='data')html=section('备份与迁移',row('folder','导出会话与项目','','导出备份')+row('folder','导入备份','','导入备份','导入历史只读'))+section('诊断数据',row('file','导出脱敏日志','','导出日志'))+'<p class="note">导出前应明确文件内容与保存位置。账号凭据独立管理。</p>';
if(page==='about')html='<div style="padding:12px 0 25px"><div class="brand">eva.</div><p class="note">Eva Android · 0.0.57<br>手机执行，云端智能</p></div>'+section('诊断',row('file','运行提示记录','','运行提示记录')+row('code','运行环境诊断','','运行环境')+row('info','开源许可','','开源许可'));
if(page==='tools')html='<p class="note">常用执行能力集中在这里。</p>'+section('设备与网络',row('phone','手机控制','','手机控制授权')+row('globe','Eva 浏览器','','浏览器预览')+row('grid','网络采集与分析','','网络采集与分析')+row('phone','语音唤醒与灵动岛','测试版','语音唤醒'))+section('文件与开发',row('folder','工作区文件','','工作区文件')+row('code','终端','','终端')+row('file','办公文档','','办公文档'))+section('任务',row('clock','定时任务','','定时任务')+row('file','执行记录','','执行记录'));
if(page==='memory')html='<p class="note">管理 Eva 可在后续任务中读取的记忆。</p>'+section('已保存 · 示例',row('file','偏好简洁的中文回答','','记忆详情','用户记忆 · 最近更新'))+row('plus','新建记忆','','新建记忆');
if(page==='hooks')html='<p class="note">在任务生命周期内按配置执行命令。</p>'+section('用户钩子',row('code','任务完成后检查','未信任','钩子详情','示例 · Stop'))+row('plus','新建钩子','','新建钩子')+'<details class="note"><summary>执行与信任</summary>保存声明后仍需核对命令与指纹，再显式信任。来源、启停与信任状态分别展示。</details>';
if(page==='extensions'){html=`<div class="tabs" role="tablist">${['插件','技能','MCP'].map(t=>`<button role="tab" aria-selected="${t===tab}" class="${t===tab?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><label class="search">${ic('search')}<input aria-label="搜索扩展" placeholder="搜索${tab}" oninput="filterExtensions(this.value)"></label><div class="toolbar"><select aria-label="筛选范围" onchange="filter=this.value;render()" style="background:var(--bg);border:0"><option ${filter==='已安装'?'selected':''}>已安装</option><option ${filter==='发现'?'selected':''}>发现</option></select><button class="primary" onclick="go('添加${tab}')">＋ 添加${tab}</button></div><div id="extension-list"></div>`;}
if(page==='chat'){content.classList.add('chat');html='<div class="bubble">帮我调整设置页的布局，让它更紧凑一些。</div><div class="completed">'+ic('check')+'已完成 · 3 个执行步骤</div><p>已整理设置页的层级，并统一了列表间距。</p><p>账号、扩展、偏好与应用信息现在分别归组。重复的页面标题已合并，常用操作保留在内容附近。</p><button class="change" onclick="go(\'本轮文件变更\')">'+ic('file')+'<span>2 个文件已修改</span><span class="green">+24</span><span style="color:#a4776a">−18</span>'+ic('arrow','arrow')+'</button><div class="actions">'+btn('copy','复制回答',"copyAnswer()")+'</div><div class="completed" style="margin-top:42px">另一种状态 · 无文件变更</div><p>浏览器启动页可以在设置中调整。</p><div class="actions">'+btn('copy','复制这条回答',"copyAnswer()")+'</div>';document.querySelector('#dock').innerHTML='<div class="composer">继续这个任务…<footer><span>＋ &nbsp; DeepSeek · 示例</span><span>↑</span></footer></div>';}
if(page==='本轮文件变更')html='<p class="note">当前回答的文件变更 · 示例数据</p><div class="toolbar"><b>2 个文件</b><span class="green">+24 <span style="color:#a4776a">−18</span></span></div>'+['settings.js','product-ui.css'].map((f,i)=>`<details class="file" open><summary>${f}</summary><div class="diff"><span style="color:#a4776a">− ${i?'padding: 24px 20px;':'旧设置分组'}</span>\n<span class="green">+ ${i?'padding: 16px 20px;':'账号 / 能力 / 偏好 / 应用'}</span></div></details>`).join('');

if(['文档助手','网页研究','课程制作','代码审查','项目服务'].includes(page))html='<div class="tile">'+ic('grid')+'</div><h3>'+page+'</h3><p class="note">示例扩展 · 展示来源、能力介绍与当前状态。</p>'+section('状态',switchRow('在 Eva 中启用',true))+section('信息','<div class="row">来源<span class="value" style="margin-left:auto">用户安装 · 示例</span></div>')+'<button class="outline" onclick="toast(\'预览中不执行卸载\')">卸载</button>';

function detail(name){go(name)}
function filterExtensions(q){const data=tab==='插件'?[['文档助手','文档处理与导出'],['网页研究','搜索与资料整理']]:tab==='技能'?[['课程制作','结构化课程与知识图解'],['代码审查','检查变更与潜在问题']]:[['项目服务','远程 HTTPS · 示例未连接']];const list=data.filter(x=>x.join('').includes(q));document.querySelector('#extension-list').innerHTML=filter==='发现'?'<div class="empty">'+ic('search')+'<h3>浏览可用扩展</h3><p class="note">正式版本在此读取扩展来源。</p><button class="outline" onclick="toast(\'此处预留现有来源管理入口\')">管理来源</button></div>':list.length?list.map(([name,desc])=>`<div class="row"><button class="tile" onclick="go('${name}')" aria-label="查看${name}">${ic(tab==='MCP'?'globe':'grid')}</button><button class="copy" style="text-align:left" onclick="go('${name}')"><b>${name}</b><small>${desc}</small></button>${tab==='MCP'?'<span class="pill">未连接</span>':`<button class="switch" role="switch" aria-label="启用${name}" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"></button>`}</div>`).join(''):'<div class="empty">'+ic('search')+'<h3>没有匹配的结果</h3><p class="note">试试其他名称或关键词。</p></div>';}
